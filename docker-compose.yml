
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_batak_store
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: db_batak_store
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_batak_store
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
